.win{border:1px solid var(--lo);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),0 0 0 1px var(--gra2)}
.tbar{display:flex;align-items:center;gap:8px;padding:4px 4px 4px 10px;background:var(--gra2);font-family:var(--px);font-size:13px;letter-spacing:1px;color:var(--fro);min-height:30px}
.tbar.blood{background:var(--blo);color:#fff}.tbar .x{margin-left:auto;width:26px;height:22px;padding:0;background:var(--gra);color:var(--ink);display:flex;align-items:center;justify-content:center}

#app{display:flex;flex-direction:column;height:100%}

.search #qx{width:30px;height:30px;border:0;background:none;color:var(--mut);font-size:15px}
#qres{display:none;position:absolute;left:-1px;right:-1px;top:calc(100% + 4px);background:var(--gra);max-height:55vh;overflow:auto;z-index:1000}
.qi{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--mid);font-size:14px;cursor:pointer}.qi:hover{background:var(--gra2)}.qi:last-child{border:0}
.qh{padding:6px 12px;font-family:var(--px);font-size:11px;letter-spacing:1px;color:var(--mut);text-transform:uppercase}
.readout{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;background:var(--mid);font-family:var(--vt);font-size:20px;color:var(--fro);white-space:nowrap}
.readout em{font-style:normal;color:var(--sag)}#wx{margin-left:auto}#snd{order:5;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;background:var(--gra);color:var(--fro);flex:none}#snd[aria-pressed=false]{color:var(--mut)}#wx small{font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:var(--mut);line-height:1.15}
#body{flex:1;display:flex;gap:8px;padding:8px;min-height:0}
#rail{flex:0 0 74px;display:flex;flex-direction:column;gap:6px;padding:8px 6px;background:var(--gra)}
#rail button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;background:var(--gra);color:var(--fro);font-size:11px}
#rail button.on{background:var(--mid);color:var(--ink);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 #3a4552;border-color:#3a4552}#rail button.on svg{color:var(--sag)}
#rail .sp{flex:1}#rail #fab{background:var(--blo);color:#fff}
main{flex:1;position:relative;min-width:0;min-height:0}
.view{position:absolute;inset:0;overflow:auto;display:none;background:var(--gra);padding:0 16px 16px}
.view.on{display:block}
.view[data-title]{border:1px solid var(--lo);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
.view[data-title]::before{content:attr(data-title);display:block;position:sticky;top:0;z-index:5;margin:0 -16px 12px;padding:6px 12px;background:var(--gra2);font-family:var(--px);font-size:13px;letter-spacing:1px;color:var(--fro)}
.view:not(#mapv)>*{max-width:780px;margin-left:auto;margin-right:auto}
.view:not(#mapv)>button,.view:not(#mapv)>a:not(.discord),.view:not(#mapv)>input{display:block}
#sheetBody>button.b{display:block}
#mapv{padding:0;overflow:hidden;background:transparent}
.mapwin{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--gra)}
.seg{margin-left:auto;display:flex}.seg button{padding:3px 10px;white-space:nowrap;background:var(--gra);color:var(--mut);font-size:12px;font-family:'IBM Plex Sans',sans-serif;letter-spacing:0}
.seg button.on{background:var(--mid);color:var(--ink);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 #3a4552;border-color:#3a4552}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 8px;border-bottom:1px solid var(--mid);scrollbar-width:thin}
.chip{display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--gra);color:var(--fro);padding:4px 10px;font-size:12px}
.chip.on{background:var(--mid);color:var(--ink);box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 #3a4552;border-color:#3a4552}
.chip.sepl{margin-left:8px}
.mapbox{position:relative;flex:1;margin:6px;min-height:0;background:#151b1a;overflow:hidden}
#map{position:absolute;inset:0;background:#151b1a}
.status{display:flex;gap:16px;align-items:center;margin:0 6px 6px;padding:3px 10px;background:#1a2027;font-size:12px;color:var(--mut)}.status b{color:var(--sag);font-weight:400}
#hint{position:absolute;z-index:800;left:50%;transform:translateX(-50%);bottom:16px;background:var(--blo);color:#fff;padding:8px 14px;font-size:14px;display:none;border:1px solid var(--lo)}
/* pixel tiles */
.tl-px img,.tl-pxc img{image-rendering:pixelated}
.tl-pxc{filter:url(#posterize) brightness(.72) saturate(.85) contrast(1.08)}
.tl-px{filter:invert(1) grayscale(1) sepia(.45) hue-rotate(55deg) saturate(.7) brightness(.82) contrast(1.15)}
/* markers */
.mk{width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.mk svg{filter:drop-shadow(1px 0 0 #AAB8C5) drop-shadow(-1px 0 0 #AAB8C5) drop-shadow(0 1px 0 #AAB8C5) drop-shadow(0 -1px 0 #AAB8C5)}
.mk.sel{border:2px solid var(--blo);background:rgba(151,64,72,.28)}
.mk.find{border:2px dashed #fff;background:rgba(151,64,72,.45)}
.marker-cluster,.marker-cluster div{background:transparent!important}

.marker-cluster span{line-height:26px}

.leaflet-container{font:inherit;background:#151b1a}
.leaflet-bar{border:0!important;box-shadow:none!important;display:flex;flex-direction:column;gap:4px}
.leaflet-bar a,.leaflet-bar a:hover{width:36px!important;height:36px!important;line-height:34px!important;border-radius:0!important;background:var(--gra);color:var(--ink);font-family:var(--vt);font-size:24px}
.leaflet-control-layers{border-radius:0!important;background:var(--gra)!important;color:var(--ink);border:1px solid var(--lo)!important;box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)!important}
.leaflet-control-layers-toggle{filter:invert(.85)}
.leaflet-control-attribution{background:rgba(16,20,26,.8)!important;color:var(--mut)!important;font-size:10px}.leaflet-control-attribution a{color:var(--fro)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{border-radius:0;background:var(--gra);color:var(--ink);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),0 2px 0 var(--lo)}
.leaflet-popup-content button{margin-top:6px;padding:6px 10px;border:1px solid var(--lo);background:var(--sag);color:var(--mid);font-weight:600;box-shadow:inset 1px 1px 0 #b7c6ad,inset -1px -1px 0 #4f5e4b}
/* observation panel (desktop) */
#obs{flex:0 0 370px;display:none;flex-direction:column;background:var(--gra);min-height:0}
#obsBody{flex:1;overflow:auto;padding:14px}
.empty{color:var(--mut);text-align:center;padding:40px 12px;line-height:1.6}
.obs-head{display:flex;gap:12px;align-items:flex-start}
.obs-ico{flex:none;width:56px;height:56px;display:flex;align-items:center;justify-content:center;background:var(--mid)}
.tag{display:inline-block;padding:1px 8px;background:var(--sag);color:var(--mid);font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.tag.ab{background:var(--ste)}
.obs-head h3{margin:4px 0 2px;font-size:19px;line-height:1.25}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;padding:10px 12px;background:var(--mid);margin:12px 0;font-size:12px}
.grid2 span{display:block;color:var(--mut)}.grid2 b{display:block;font-family:var(--vt);font-weight:400;font-size:18px;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px}.row .b{flex:1 1 140px;width:auto}
/* dialogs */
#sheet{position:fixed;inset:0;background:rgba(10,13,17,.7);display:none;z-index:2000;align-items:flex-end;justify-content:center}#sheet.open{display:flex}
#sheetBody{background:var(--gra);width:100%;max-height:88%;overflow:auto;padding:0 16px 16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-width:620px;border:1px solid var(--lo);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),0 0 0 1px var(--gra2)}
#sheetBody::before{content:'APPALACHIA.EXE';display:block;position:sticky;top:0;z-index:2;margin:0 -16px 12px;padding:6px 12px;background:var(--blo);color:#fff;font-family:var(--px);font-size:12px;letter-spacing:1px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--mid);padding:10px;margin:5px 0;border-radius:0}
button.b{width:100%;padding:11px;margin:5px 0;background:var(--sag);color:var(--mid);font-weight:600;border-radius:0}
button.b.s{background:var(--gra);color:var(--ink);font-weight:500}button.b.d{background:var(--gra);color:var(--red);font-weight:500}
button.b:active,#rail button:active,.chip:active{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
textarea{min-height:100px}
/* themed scrollbars (no white strip) */
html,body,*{scrollbar-color:#3a4552 #10141A;scrollbar-width:thin}
::-webkit-scrollbar{width:12px;height:12px;background:#10141A}
::-webkit-scrollbar-thumb{background:#3a4552;border:2px solid #10141A;box-shadow:inset 1px 1px 0 #8798AA}
::-webkit-scrollbar-thumb:hover{background:#4a5664}::-webkit-scrollbar-corner{background:#10141A}
/* themed file picker */
input[type=file]{padding:6px;font-size:14px;color:var(--mut)}
input[type=file]::file-selector-button{font:inherit;font-size:13px;font-weight:600;margin-right:10px;padding:7px 12px;background:var(--gra);color:var(--ink);border:1px solid var(--lo);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);cursor:var(--cur-hot)}
input[type=file]::file-selector-button:hover{background:var(--gra2)}
.meta{color:var(--mut);font-size:13px;margin:2px 0}.photo{width:100%;margin:8px 0;display:block;image-rendering:auto}
h2,h3{margin:6px 0}h2{font-family:var(--px);font-weight:500;letter-spacing:1px;font-size:20px}
.item{background:var(--gra);padding:12px;margin:8px 0;cursor:default}.item[data-id]{cursor:pointer}.item[data-id]:hover{background:var(--gra2)}
.err{color:var(--red);font-size:14px}.ok{color:var(--sag);font-size:14px}
.tabs{display:flex;gap:6px}.tabs button{flex:1}
.discord{display:flex;gap:12px;align-items:center;background:#5865F2;color:#fff;text-decoration:none;padding:12px 14px;margin:10px 0;border:1px solid var(--lo);box-shadow:inset 1px 1px 0 #8b95f7,inset -1px -1px 0 #2e3794}.discord svg{width:34px;height:34px;flex:none;fill:#fff}.discord span{font-size:14px;line-height:1.3}

.msg{background:var(--mid);padding:8px 10px;max-width:85%;align-self:flex-start;white-space:pre-wrap;word-break:break-word;border:1px solid #3a4552}
.msg.me{align-self:flex-end;background:#2a3a33;border-color:#4f5e4b}.msg small{display:block;color:var(--mut);font-size:12px}.msg u{cursor:pointer;color:var(--red);font-size:12px}
.row2{display:flex;gap:6px}.row2 input{margin:5px 0}.row2 button{flex:none}

const setMode = mode => {

  [pxLayer, detailLayer, pxcLayer].forEach(l => map.removeLayer(l)); layersCtl.remove(); pxcCtl.remove();

const WX = c => c === 0 ? 'Clear' : c <= 2 ? 'Partly cloudy' : c === 3 ? 'Overcast' : c <= 48 ? 'Fog' : c <= 57 ? 'Drizzle' : c <= 67 ? 'Rain' : c <= 77 ? 'Snow' : c <= 82 ? 'Showers' : c <= 86 ? 'Snow showers' : 'Thunderstorm';
const wxCache = new Map();
const getWx = async (lat, lon) => {
  const k = lat.toFixed(1) + ',' + lon.toFixed(1); if (wxCache.has(k)) return wxCache.get(k);
  const pr = fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(2)}&longitude=${lon.toFixed(2)}&current=temperature_2m,weather_code&temperature_unit=fahrenheit`)
    .then(r => r.json()).then(j => ({t: Math.round(j.current.temperature_2m), d: WX(j.current.weather_code)})).catch(() => null);
  wxCache.set(k, pr); return pr;
};

// ---------- search ----------
{
  const parseCoords = raw => {
    const t = String(raw).replace(/[’‘′]/g, "'").replace(/[”“″]/g, '"').replace(/''/g, '"').replace(/º/g, '°').trim();
    let lat, lon, m, letters = false;
    if ((m = t.match(/^(\d{1,2})\s*°\s*(\d{1,2}(?:\.\d+)?)\s*'\s*(?:(\d{1,2}(?:\.\d+)?)\s*"\s*)?([NS])[\s,;]*(\d{1,3})\s*°\s*(\d{1,2}(?:\.\d+)?)\s*'\s*(?:(\d{1,2}(?:\.\d+)?)\s*"\s*)?([EW])$/i))) {
      lat = (+m[1] + +m[2] / 60 + (+m[3] || 0) / 3600) * (/s/i.test(m[4]) ? -1 : 1);
      lon = (+m[5] + +m[6] / 60 + (+m[7] || 0) / 3600) * (/w/i.test(m[8]) ? -1 : 1); letters = true;
    } else if ((m = t.match(/^([+-]?\d{1,3}(?:\.\d+)?)\s*°?\s*([NS])?[\s,;\/]+([+-]?\d{1,3}(?:\.\d+)?)\s*°?\s*([EW])?$/i))) {
      lat = +m[1]; lon = +m[3];
      if (m[2] && /s/i.test(m[2])) lat = -Math.abs(lat);
      if (m[4] && /w/i.test(m[4])) lon = -Math.abs(lon);
      letters = !!(m[2] || m[4]);
    } else return null;
    if (!letters && ((Math.abs(lat) > 90 && Math.abs(lon) <= 90) || (lat < -71 && lat > -88 && lon > 31 && lon < 46))) [lat, lon] = [lon, lat]; // “lon, lat” order
    if (!isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
    return {lat, lon};
  };
  
  const q = $('#q'), res = $('#qres'); let pin = null, token = 0, last = {s: new Map(), p: [], c: null};
  const hide = () => { res.style.display = 'none'; };
  const inArea = c => c.lat >= 31 && c.lat <= 46 && c.lon >= -88 && c.lon <= -71;
  const drop = (ll, title, zoom) => {
    map.setView(ll, zoom); if (pin) pin.remove();
    const box = document.createElement('div');
    box.innerHTML = `<b>${esc(title)}</b><br><span style="font-size:12px;color:#8798AA;font-family:VT323,monospace;font-size:16px">${ll[0].toFixed(5)}, ${ll[1].toFixed(5)}</span><br>`;
    const btn = document.createElement('button'); btn.textContent = '＋ Report here';
    btn.onclick = () => { if (canPost()) addSheet(L.latLng(ll)); }; box.appendChild(btn);
    pin = L.marker(ll, {icon: L.divIcon({className: '', html: `<div class="mk find">${sprite('mark', 28)}</div>`, iconSize: [40, 40]})}).addTo(map).bindPopup(box).openPopup();
  };
  const doSearch = async () => {
    const text = q.value.trim(); if (text.length < 2) { hide(); return; }
    const my = ++token; res.style.display = 'block';
    const c = parseCoords(text);
    if (c) {
      last = {s: new Map(), p: [], c};
      res.innerHTML = inArea(c) ? `<div class="qh">Coordinates</div><div class="qi" data-t="c">📌 ${c.lat.toFixed(5)}, ${c.lon.toFixed(5)}</div>`
        : '<div class="qi meta">These coordinates are outside the Appalachia map area (lat 31 to 46, lon −88 to −71).</div>';
      return;
    }
    res.innerHTML = '<div class="qi meta">Searching…</div>';
    const ql = text.toLowerCase();
    const found = new Map([...seen.values()].filter(x => (x.title + ' ' + (x.details || '')).toLowerCase().includes(ql)).map(x => [x.id, x]));
    const variants = [...new Set([text, text[0].toUpperCase() + text.slice(1), ql])];
    const tasks = variants.map(async v => {
      try {
        const snap = await getDocs(query(collection(db, 'sightings'), where('title', '>=', v), where('title', '<=', v + '\uf8ff'), limit(10)));
        snap.docs.forEach(d => { const x = {id: d.id, ...d.data()}; if (okItem(x.authorID, x.id)) { found.set(x.id, x); seen.set(x.id, x); } });
      } catch {}
    });
    let places = [];
    tasks.push((async () => {
      try { const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=us&accept-language=en&viewbox=-88,46,-71,31&bounded=1&q=' + encodeURIComponent(text)); places = await r.json(); } catch {}
    })());
    await Promise.all(tasks); if (my !== token) return;
    last = {s: found, p: places, c: null};
    const reps = [...found.values()].slice(0, 8);
    res.innerHTML = (reps.length ? '<div class="qh">Reports</div>' + reps.map(x => `<div class="qi" data-t="s" data-id="${esc(x.id)}">${catIco(x.category, 18)}<span>${esc(x.title)}</span></div>`).join('') : '')
      + (places.length ? '<div class="qh">Places</div>' + places.map((x, i) => `<div class="qi" data-t="p" data-i="${i}">📍 ${esc(x.display_name)}</div>`).join('') : '')
      || '<div class="qi meta">Nothing found. Try another name or coordinates like 37.5, -80.5 (places are searched within Appalachia).</div>';
  };
  q.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); q.blur(); doSearch(); } });
  $('#qx').onclick = () => { q.value = ''; token++; hide(); if (pin) { pin.remove(); pin = null; } };
  map.on('click', hide);
  res.onclick = e => {
    const i = e.target.closest('.qi'); if (!i || !i.dataset.t) return; hide();
    if (i.dataset.t === 's') {
      const x = last.s.get(i.dataset.id); if (!x) return;
      map.setView([x.lat, x.lon], 14); setTimeout(() => showSighting(x), 250);
    } else if (i.dataset.t === 'c') {
      if (last.c) drop([last.c.lat, last.c.lon], 'Coordinates', 14);
    } else {
      const pl = last.p[+i.dataset.i]; if (pl) drop([+pl.lat, +pl.lon], pl.display_name.split(',').slice(0, 2).join(','), 13);
    }
  };
}

function resize(file) {
  return new Promise((res, rej) => { const img = new Image();
    img.onload = () => { const s = Math.min(1, 900 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', .6)); };
    img.onerror = rej; img.src = URL.createObjectURL(file); });
}

    case 'bricks': fill('#1c1f25'); for (let y = 0; y < T; y += 6) for (let x = (y / 6 % 2) * 6; x < T + 12; x += 12) { p(x, y, '#262a32', 11, 5); if (R() < 0.3) p(x + 2, y + 1, '#2c313a', 3, 1); } break;
    case 'planks': fill('#1e1a17'); for (let x = 0; x < T; x += 8) { p(x, 0, '#14110f', 1, T); for (let y = 0; y < T; y += 3) if (R() < 0.35) p(x + 2 + (R() * 4 | 0), y, '#28221d', 2, 1); p(x + 4, (x * 7) % T, '#14110f', 1, 1); } break;
    case 'circuit': fill('#141c18'); for (let i = 0; i < 6; i++) { let x = R() * T | 0, y = R() * T | 0; const len = 8 + (R() * 14 | 0), horiz = R() < 0.5; for (let k = 0; k < len; k++) p(horiz ? x + k : x, horiz ? y : y + k, '#24342b'); p(x, y, '#3a5244', 2, 2); } break;
    case 'crt': fill('#1a2027'); for (let y = 0; y < T; y += 3) p(0, y, '#1f2730', T, 1); break;
    case 'noise': for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) p(x, y, ['#1a2027', '#1f262f', '#232A33', '#2a323d'][(R() * R() * 4) | 0]); break;
    case 'checker': for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) p(x, y, ((x >> 3) + (y >> 3)) % 2 ? '#1f262f' : '#232b35'); break;
    case 'topo': fill('#1a1f24'); for (let k = 0; k < 4; k++) { const off = k * 12; for (let x = 0; x < T; x++) p(x, Math.round(off + 4 * Math.sin(x / T * Math.PI * 2 + k)), '#28323a'); } break;
    case 'bloodrain': fill('#1a1316'); scatter(10, x => { const y = R() * T | 0; p(x, y, '#3a1a20', 1, 4); p(x, y + 4, '#4a2028'); }); break;
    case 'moss': fill('#18201b'); scatter(70, (x, y) => p(x, y, R() < 0.5 ? '#202b23' : '#26332a', 1 + (R() * 2 | 0), 1)); break;
    case 'fireflies': fill('#151b17'); scatter(5, (x, y) => { p(x, y, '#6a7a40'); p(x - 1, y, '#2a3322'); p(x + 1, y, '#2a3322'); p(x, y - 1, '#2a3322'); p(x, y + 1, '#2a3322'); }); break;
    case 'snow': fill('#1e252e'); scatter(16, (x, y) => p(x, y, R() < 0.3 ? '#4a5664' : '#353f4b')); break;
    case 'leaves': fill('#1e1916'); scatter(9, (x, y) => { const col = ['#3a2418', '#4a2e1a', '#3a3018'][(R() * 3) | 0]; p(x, y, col, 2, 1); p(x + 1, y + 1, col, 2, 1); p(x + 2, y + 2, col); }); break;
    case 'sigils': fill('#191b22'); for (const [x, y] of [[8, 8], [32, 32]]) { p(x, y, '#2e2a3c', 7, 1); p(x + 3, y, '#2e2a3c', 1, 8); p(x, y + 7, '#2e2a3c', 7, 1); p(x + 1, y + 3, '#2e2a3c', 5, 1); } for (const [x, y] of [[34, 8], [10, 32]]) { p(x + 2, y, '#2a2636', 1, 1); p(x, y + 2, '#2a2636', 5, 1); p(x + 2, y + 4, '#2a2636'); } break;
    case 'ufos': fill('#141920'); for (const [x, y] of [[6, 8], [30, 32]]) { p(x + 3, y, '#2e3845', 4, 1); p(x + 1, y + 1, '#2e3845', 8, 1); p(x, y + 2, '#38434f', 10, 1); p(x + 2, y + 3, '#2a3a2a', 6, 1); } scatter(6, (x, y) => p(x, y, '#2a323d')); break;
    case 'paws': fill('#1d1f22'); for (const [x, y] of [[8, 6], [20, 18], [32, 30], [44, 42]]) { p(x, y + 2, '#2c2e33', 3, 2); p(x - 1, y, '#2c2e33'); p(x + 1, y - 1, '#2c2e33'); p(x + 3, y, '#2c2e33'); } break;
    case 'quilt': fill('#1c2129'); for (let y = 0; y < T; y++) for (let x = 0; x < T; x++) { const a = (x + y) % 12, b = (x - y + 48) % 12; if (a === 0 || b === 0) p(x, y, '#262d37'); } break;
    case 'damask': fill('#1b1e26'); for (const [cx, cy] of [[12, 12], [36, 36]]) { for (let y = -7; y <= 7; y++) { const w = Math.round(4 * Math.cos(y / 7 * 1.4)); if (w > 0) { p(cx - w, cy + y, '#262a36', 1, 1); p(cx + w, cy + y, '#262a36', 1, 1); } } p(cx, cy - 8, '#2c3140', 1, 17); p(cx - 2, cy, '#2c3140', 5, 1); } break;
    case 'rain': fill('#1a2027'); scatter(14, x => { const y = R() * T | 0; p(x, y, '#2a3440', 1, 3); }); break;
  }
  return pbgCache[id] = c.toDataURL('image/png');
};

const JPEG = /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;
const pageBg = (el, id) => { const u = pbgUrl(id); el.style.backgroundImage = u ? `url(${u})` : ''; el.style.backgroundSize = u ? '144px 144px' : ''; el.style.imageRendering = u ? 'pixelated' : ''; };
const safeUrl = u => { try { const x = new URL(String(u)); return x.protocol === 'https:' ? x.href : null; } catch { return null; } };
const plink = (uid, name) => uid ? `<a href="#" class="prof" data-uid="${esc(uid)}">${esc(name || 'User')}</a>` : esc(name || 'User');
document.addEventListener('click', e => { const a = e.target.closest('a.prof'); if (!a) return; e.preventDefault(); e.stopPropagation(); openProfile(a.dataset.uid); }, true);
const profCache = new Map();
const getProfile = async (uid, fresh) => {

const avatarHtml = (p, sm) => {

const statCell = (n, label) => `<div class="stat sunken"><b>${n}</b><span>${label}</span></div>`;
const countReports = async uid => { try { return (await getDocs(query(collection(db, 'sightings'), where('authorID', '==', uid), limit(500)))).size; } catch { return '—'; } };
// keep the admin-only email copy in sync (readable only by its owner and the admin)
let privSynced = null;
const syncPrivate = () => { if (!user || !user.email || privSynced === user.uid) return; privSynced = user.uid;
  setDoc(doc(db, 'private', user.uid), {email: user.email}).catch(() => { privSynced = null; });
  if (user.emailVerified) ensureProfile(); };
// every verified user gets a public profile doc so others can find them by nickname
const ensureProfile = async () => {
  try {

async function friendState(uid) {
  if (!user || uid === user.uid) return 'self';
  try {
    if ((await getDoc(doc(db, `users/${user.uid}/friends`, uid))).exists()) return 'friend';
    if ((await getDoc(doc(db, `requests/${user.uid}/in`, uid))).exists()) return 'incoming';
    if ((await getDoc(doc(db, `requests/${uid}/in`, user.uid))).exists()) return 'outgoing';
  } catch {}
  return 'none';
}
const myName = () => (user.displayName || 'User').slice(0, 30);
async function acceptFriend(uid, name) {
  const b = writeBatch(db);
  b.set(doc(db, `users/${user.uid}/friends`, uid), {name: String(name || 'User').slice(0, 30), at: serverTimestamp()});
  b.set(doc(db, `users/${uid}/friends`, user.uid), {name: myName(), at: serverTimestamp()});
  b.delete(doc(db, `requests/${user.uid}/in`, uid));
  await b.commit();
}
async function removeFriend(uid) {
  const b = writeBatch(db);
  b.delete(doc(db, `users/${user.uid}/friends`, uid)); b.delete(doc(db, `users/${uid}/friends`, user.uid));
  await b.commit();
}

async function openProfile(uid) {
  if (!uid) return;
  if (user && uid === user.uid) { closeSheet(); showView('profile'); return; }
  sheet('<p class="meta">Loading profile…</p>');
  const p = await getProfile(uid, true);
  let fcount = 0; try { fcount = (await getDocs(collection(db, `users/${uid}/friends`))).size; } catch {}
  const rcount = await countReports(uid);
  sheet(profileCard(p, 'User', {title: 'USER PROFILE', stats: statCell(rcount, 'Reports') + statCell(fcount, fcount === 1 ? 'Friend' : 'Friends')}) + `<div id="fbtn"></div><div id="adm1"></div><button class="b s" id="cx">Close</button>`);
  if (p) pageBg($('#sheetBody'), p.pbg);
  $('#cx').onclick = closeSheet;
  const draw = async () => {
    const st = await friendState(uid), box = $('#fbtn'); if (!box) return;
    const nm = p?.name || 'User';
    box.innerHTML = st === 'friend' ? '<button class="b s" id="fr1">✓ Friends — remove</button>'
      : st === 'incoming' ? '<div class="row"><button class="b" id="fr1">Accept friend request</button><button class="b s" id="fr2">Decline</button></div>'
      : st === 'outgoing' ? '<button class="b s" id="fr1">Request sent — cancel</button>'
      : st === 'none' ? '<button class="b" id="fr1">＋ Add friend</button>' : '';
    const f1 = $('#fr1'), f2 = $('#fr2');
    if (f1) f1.onclick = async () => {
      if (st === 'none' && !canPost()) return;
      try {
        if (st === 'friend') await removeFriend(uid);
        else if (st === 'incoming') { await acceptFriend(uid, nm); sfx('success'); }
        else if (st === 'outgoing') await deleteDoc(doc(db, `requests/${uid}/in`, user.uid));
        else { await setDoc(doc(db, `requests/${uid}/in`, user.uid), {name: myName(), at: serverTimestamp()}); sfx('success'); }
        draw();
      } catch { toast('Could not update friends. Try again.'); }
    };
    if (f2) f2.onclick = async () => { try { await deleteDoc(doc(db, `requests/${user.uid}/in`, uid)); draw(); } catch { toast('Could not decline.'); } };
  };
  draw();
  if (isAdmin()) {
    try { const pv = await getDoc(doc(db, 'private', uid)); const a = $('#adm1');
      if (a) a.innerHTML = `<div class="adminbox">🔒 Admin only · email: <b>${esc(pv.exists() ? pv.data().email : 'not recorded yet')}</b><br><span class="meta">User ID: ${esc(uid)}</span></div>`; } catch {}
  }
}

const cropJpeg = (file, w, h, q) => new Promise((res, rej) => { const img = new Image();
  img.onload = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; const k = Math.max(w / img.width, h / img.height);
    const sw = w / k, sh = h / k; c.getContext('2d').drawImage(img, (img.width - sw) / 2, (img.height - sh) / 2, sw, sh, 0, 0, w, h);
    URL.revokeObjectURL(img.src); res(c.toDataURL('image/jpeg', q)); };
  img.onerror = rej; img.src = URL.createObjectURL(file); });

async function deleteMyProfileData() {
  const uid = user.uid;
  try { const fr = await getDocs(collection(db, `users/${uid}/friends`));
    for (const d of fr.docs) { await deleteDoc(doc(db, `users/${d.id}/friends`, uid)).catch(() => {}); await deleteDoc(d.ref).catch(() => {}); } } catch {}
  try { const rq = await getDocs(collection(db, `requests/${uid}/in`)); for (const d of rq.docs) await deleteDoc(d.ref).catch(() => {}); } catch {}
  await deleteDoc(doc(db, 'users', uid)).catch(() => {});
  await deleteDoc(doc(db, 'private', uid)).catch(() => {});
}

const FTAGS = [['general', 'General', '#8798AA'], ['sightings', 'Sightings', '#84977A'], ['expeditions', 'Expeditions', '#d9c27a'], ['evidence', 'Evidence', '#AAB8C5'],
  ['legends', 'Legends & Lore', '#a08cc8'], ['abandoned', 'Abandoned Places', '#b7a08f'], ['offtopic', 'Off-topic', '#6b7a88']];

const ago = ts => { const d = ts?.toDate ? ts.toDate() : null; if (!d) return 'just now'; const s0 = (Date.now() - d) / 1000;

// ---------- HAUNT card game: rules engine (pure, JSON state) ----------
const HC = {r: ['Blood', '#b84a55'], g: ['Moss', '#7f9a6e'], b: ['Steel', '#5f86ad'], y: ['Bone', '#cdb36a']};
const H = {
  deck() { const d = []; for (const c of 'rgby') { d.push(c + '0'); for (const v of '123456789SRD') d.push(c + v, c + v); } for (let i = 0; i < 4; i++) d.push('wW', 'wF'); return d; },
  shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  clone: s => JSON.parse(JSON.stringify(s)),
  top: s => s.discard[s.discard.length - 1],
  active: s => s.order.filter(p => !s.out.includes(p) && !(s.done || []).includes(p)),
  ord: n => n + (['th', 'st', 'nd', 'rd'][n % 100 > 10 && n % 100 < 14 ? 0 : n % 10] || 'th'),
  finish(s) { s.places = [...(s.done || []), ...[...s.out].reverse().filter(p => !(s.done || []).includes(p))]; s.winner = s.places[0] || null; s.boo = null; return s; },
  cur: s => s.order[s.turn],
  newGame(order, names, bots = {}) {
    const deck = H.shuffle(H.deck()), hands = {};
    order.forEach(p => { hands[p] = deck.splice(0, 7); });
    let first; do { first = deck.shift(); if (first[0] === 'w' || isNaN(+first[1])) { deck.push(first); first = null; } } while (!first);
    return {v: 1, order: [...order], names: {...names}, bots: {...bots}, hands, deck, discard: [first], color: first[0], turn: 0, dir: 1,
      drawn: null, moves: 0, winner: null, out: [], done: [], log: 'Game started', last: null};
  },
  step(s, n = 1) { let t = s.turn; for (let k = 0; k < n; k++) { let guard = 0; do { t = (t + s.dir + s.order.length) % s.order.length; } while ((s.out.includes(s.order[t]) || (s.done || []).includes(s.order[t])) && ++guard < 10); } return t; },
  draw1(s) {
    if (!s.deck.length) { const top = s.discard.pop(); s.deck = H.shuffle(s.discard); s.discard = [top]; }
    return s.deck.length ? s.deck.shift() : null;
  },
  give(s, p, n) { for (let i = 0; i < n; i++) { const c = H.draw1(s); if (c) s.hands[p].push(c); } },
  canPlay(s, card) {
    if (s.drawn && card !== s.drawn) return false;
    if (card[0] === 'w') return true;
    const top = H.top(s);
    return card[0] === s.color || (top[0] !== 'w' && card[1] === top[1]);
  },
  // play one card, or several cards of the exact same value at once (e.g. three 2s of any colours, two Skips, two Wild +4s)
  canStack(s, cards) { if (!cards.length || !H.canPlay(s, cards[0])) return false; const v = cards[0][1];
    return cards.every(c => c[1] === v && (c[0] === 'w') === (cards[0][0] === 'w')); },
  play(s0, p, card, color) { return H.playMany(s0, p, Array.isArray(card) ? card : [card], color); },
  playMany(s0, p, cards, color) {
    const s = H.clone(s0); if (s.winner || H.cur(s) !== p) throw 'not your turn';
    if (!cards.length || !H.canPlay(s, cards[0])) throw 'illegal card';
    const v = cards[0][1], wild = cards[0][0] === 'w';
    if (cards.some(c => c[1] !== v || (c[0] === 'w') !== wild)) throw 'cards must match';
    const hand = [...s.hands[p]];
    for (const c of cards) { const i = hand.indexOf(c); if (i < 0) throw 'not in hand'; hand.splice(i, 1); }
    if (wild && !'rgby'.includes(color)) throw 'pick a color';
    s.hands[p] = hand; s.discard.push(...cards); const k = cards.length, lastC = cards[k - 1];
    s.color = wild ? color : lastC[0]; s.drawn = null; s.moves++;
    const name = s.names[p] || 'Player';
    s.last = {p, card: lastC, cards: [...cards], n: k, color: s.color};
    let finMsg = '';
    if (!s.hands[p].length) { s.done = [...(s.done || []), p]; s.boo = null; const pl = s.done.length, rest = H.active(s);
      if (rest.length <= 1) { if (rest[0]) s.done.push(rest[0]); H.finish(s); s.log = `${name} takes ${H.ord(pl)} place${rest[0] ? ` — ${s.names[rest[0]]} is ${H.ord(pl + 1)}` : ''}. Game over!`; return s; }
      finMsg = `${name} takes ${H.ord(pl)} place!`; }
    const xk = k > 1 ? ` ×${k}` : '';
    if (v === 'S') { const skipped = []; for (let i = 1; i <= k; i++) skipped.push(s.names[s.order[H.step(s, i)]]); s.turn = H.step(s, k + 1); s.log = `${name} skipped ${[...new Set(skipped)].join(', ')}`; }
    else if (v === 'R') { if (k % 2) s.dir *= -1; if (H.active(s).length === 2) { if (k % 2 === 0) s.turn = H.step(s); } else s.turn = H.step(s); s.log = `${name} reversed${xk}${k % 2 ? '' : ' (back to normal)'}`; }
    else if (v === 'D' || v === 'F') { const n = (v === 'D' ? 2 : 4) * k, nx = s.order[H.step(s)]; H.give(s, nx, n); s.turn = H.step(s, 2); s.log = `${s.names[nx]} draws ${n}!`; }
    else { s.turn = H.step(s); s.log = wild ? `${name} changed colour to ${HC[s.color][0]}${xk}` : `${name} played${k > 1 ? ` ${k} cards` : ''}`; }
    if (s.hands[p].length === 1) { s.boo = {p, until: Date.now() + 5000}; s.log += ` — ${name} must shout BOO!`; }
    if (finMsg) { s.log = `${finMsg} · ${s.log}`; if ((s.done || []).includes(H.cur(s)) || s.out.includes(H.cur(s))) s.turn = H.step(s); }
    return H.norm(s);
  },
  drawTurn(s0, p) {
    const s = H.clone(s0); if (s.winner || H.cur(s) !== p) throw 'not your turn'; if (s.drawn) throw 'already drew';
    const c = H.draw1(s); s.moves++;
    if (!c) { s.turn = H.step(s); s.log = `${s.names[p]} could not draw`; return s; }
    s.hands[p].push(c);
    if (H.canPlay({...s, drawn: null}, c)) { s.drawn = c; s.log = `${s.names[p]} drew a card`; } else { s.turn = H.step(s); s.log = `${s.names[p]} drew and passed`; }
    return H.norm(s);
  },
  pass(s0, p) { const s = H.clone(s0); if (s.winner || H.cur(s) !== p || !s.drawn) throw 'cannot pass'; s.drawn = null; s.turn = H.step(s); s.moves++; s.log = `${s.names[p]} passed`; return s; },
  timeout(s0) { const p = H.cur(s0); let s = s0.drawn ? H.pass(s0, p) : H.drawTurn(s0, p); if (s.drawn && H.cur(s) === p) s = H.pass(s, p); s.log = `${s0.names[p]} ran out of time`; return s; },
  leave(s0, p) {
    const s = H.clone(s0); H.norm(s); if (s.out.includes(p) || !s.order.includes(p)) return s;
    const wasTurn = H.cur(s) === p && !s.winner; s.out.push(p); s.deck.push(...s.hands[p]); s.hands[p] = []; s.moves++;
    s.log = `${s.names[p]} left the table`;
    const act = H.active(s);
    if (act.length < 2) { if (act[0]) s.done = [...(s.done || []), act[0]]; H.finish(s); if (s.winner) s.log += ' — game over'; return s; }
    if (wasTurn) { s.drawn = null; s.turn = H.step(s); }
    return s;
  },
  // ---- BOO! (last-card call) ----
  norm(s) { if (s.boo && (s.hands[s.boo.p]?.length !== 1 || s.out.includes(s.boo.p) || s.winner)) s.boo = null; return s; },
  booPress(s0, p) { const s = H.clone(s0); if (!s.boo || s.boo.p !== p) return s0; s.boo = null; s.booed = (s.booed || 0) + 1; s.log = `${s.names[p]} shouted BOO! 👻`; return s; },
  booPenalty(s0, now = Date.now()) { if (!s0.boo || now < s0.boo.until) return s0; const s = H.clone(s0), p = s.boo.p; s.boo = null;
    if (s.hands[p]?.length === 1 && !s.winner) { H.give(s, p, 2); s.log = `${s.names[p]} forgot to shout BOO! — draws 2`; s.pen = (s.pen || 0) + 1; } return s; },
  botBoo(s) { if (!s.boo) return false; const lv = s.bots[s.boo.p]; if (!lv) return false; const chance = lv === 'easy' ? 65 : lv === 'normal' ? 88 : 100; return ((s.moves * 7919 + s.boo.until) % 100) < chance; },
  // ---- bots ----
  bestColor(hand) { const n = {r: 0, g: 0, b: 0, y: 0}; hand.forEach(c => { if (c[0] !== 'w') n[c[0]] += c[1] > '9' ? 2 : 1; }); return Object.keys(n).sort((a, b) => n[b] - n[a])[0]; },
  botMove(s, p, level = 'normal') {
    const hand = s.hands[p], ok = hand.filter(c => H.canPlay(s, c));
    const pickColor = () => level === 'easy' ? 'rgby'[Math.random() * 4 | 0] : H.bestColor(hand.filter(c => c[0] !== 'w'));
    if (!ok.length) return s.drawn ? {a: 'pass'} : {a: 'draw'};
    if (s.drawn && level === 'easy' && Math.random() < 0.3) return {a: 'pass'};
    let card;
    if (level === 'easy') card = ok[Math.random() * ok.length | 0];
    else {
      const nx = s.order[H.step(s)], threat = s.hands[nx].length <= 2;
      const score = c => { let sc = 0; const v = c[1];
        if (c[0] === 'w') sc -= (v === 'F' ? 30 : 20) - (threat && level === 'hard' ? 40 : 0);
        if ('SRD'.includes(v)) sc += threat ? 25 : (level === 'hard' ? 2 : 6);
        if (!isNaN(+v)) sc += +v;
        if (c[0] === s.color) sc += 3;
        sc += hand.filter(x => x[0] === c[0]).length;
        if (level === 'hard') { const rest = hand.filter(x => x !== c), col = c[0] === 'w' ? H.bestColor(rest) : c[0];
          sc += 2 * rest.filter(x => x[0] === 'w' || x[0] === col || x[1] === c[1]).length; if (s.hands[nx].length <= 1 && 'SDF'.includes(v)) sc += 60; }
        return sc; };
      card = [...ok].sort((a, b) => score(b) - score(a))[0];
    }
    let cards = [card];

async function startOnline() {
  const r = G.room; if (!r || r.host !== user.uid || seatsOf(r).length < 2) return;
  const seats = H.shuffle([...seatsOf(r)]), names = {}; seats.forEach(p => names[p] = r.names[p] || 'Player');
  const bots = {}; seats.filter(isBotId).forEach(p => bots[p] = (r.bots && r.bots[p]) || 'normal');
  const s = H.newGame(seats, names, bots);
  if (G.starting) return; G.starting = true;
  try { await runTransaction(db, async tx => { const sn = await tx.get(roomRef(G.rid)); if (!sn.exists() || sn.data().status !== 'lobby') throw 'x';
      tx.update(roomRef(G.rid), {status: 'playing', st: JSON.stringify(s), mv: 0, deadline: Date.now() + 30000}); }); }
  catch (e) { if (e !== 'x') toast('Could not start.'); }
  G.starting = false;
}
function maybeAutoStart() {
  const r = G.room; if (!r || r.host !== user.uid || r.status !== 'lobby' || !r.public) return;
  const n = seatsOf(r).length; if (n >= 4 || (n >= 2 && Date.now() - (r.at || 0) > 30000)) startOnline();
}
async function onlineMove(p, mvOrFn, expectMoves) {
  if (G.busy) return; G.busy = true;
  try {
    await runTransaction(db, async tx => {
      const sn = await tx.get(roomRef(G.rid)); if (!sn.exists()) throw 'gone';
      const r = sn.data(), s = JSON.parse(r.st);
      if (expectMoves !== undefined && s.moves !== expectMoves) throw 'stale';
      const ns = typeof mvOrFn === 'function' ? mvOrFn(s) : H.apply(s, p, mvOrFn);
      tx.update(roomRef(G.rid), {st: JSON.stringify(ns), mv: ns.moves, deadline: Date.now() + 30000, status: ns.winner ? 'done' : 'playing'});
    });
  } catch (e) { if (e !== 'stale' && p === G.me) { csfx('tap'); G.selfFly = false; renderTable(); } }
  G.busy = false;
}
// every client keeps the table moving: bots, timeouts, auto-start
function onlineTick() {
  const r = G.room; if (!r) return;
  if (r.status === 'lobby') { maybeAutoStart(); const cd = $('#hcd'); if (cd) cd.textContent = Math.max(0, 30 - Math.floor((Date.now() - (r.at || Date.now())) / 1000)); return; }
  const s = G.s; if (!s || s.winner || G.mode !== 'online') return;
  paintTimer();
  const p = H.cur(s), host = r.host === G.me, idle = Date.now() - G.lastAt;
  if (s.boo) { const b = s.boo, now = Date.now();
    if (isBotId(b.p) && host && H.botBoo(s) && now > b.until - 3800) { onlineMove(b.p, st => H.booPress(st, b.p)); return; }
    if (now > b.until + (b.p === G.me ? 0 : host ? 600 : 2500)) { onlineMove(b.p, st => H.booPenalty(st)); return; } }
  if (isBotId(p) && idle > (host ? 900 : 6000)) onlineMove(p, st => H.apply(st, p, H.botMove(st, p, st.bots[p])), s.moves);
  else if (!isBotId(p) && Date.now() > (r.deadline || 0) + (p === G.me ? 0 : host ? 2000 : 8000)) onlineMove(p, st => H.timeout(st), s.moves);
}
function paintTimer() { const b = $('#tbar'); if (!b || !G.room?.deadline) return; const left = Math.max(0, G.room.deadline - Date.now()); b.style.width = (left / 300) + '%'; b.classList.toggle('low', left < 8000); }
async function leaveOnline(quiet) {
  const id = G.rid, r = G.room; if (!id || !user) return;
  stopOnline();
  try {
    if (!r || r.status === 'lobby') {
      if (r && r.host === user.uid) await deleteDoc(roomRef(id));
      else await runTransaction(db, async tx => { const sn = await tx.get(roomRef(id)); if (!sn.exists()) return; const d = sn.data();
        tx.update(roomRef(id), {players: d.players.filter(x => x !== user.uid), seats: seatsOf(d).filter(x => x !== user.uid)}); });
    } else if (r.status === 'playing') {
      await runTransaction(db, async tx => { const sn = await tx.get(roomRef(id)); if (!sn.exists()) return; const d = sn.data(), s = H.leave(JSON.parse(d.st), user.uid);
        const left = H.active(s).filter(p => !isBotId(p));
        tx.update(roomRef(id), {st: JSON.stringify(s), mv: s.moves, status: s.winner || !left.length ? 'done' : 'playing', deadline: Date.now() + 30000}); });
    }
  } catch {}
}

async function joinByCode(raw) {

}

async function loadAtt(gid, mid) {
  const k = gid + '/' + mid; if (attCache.has(k)) return attCache.get(k);
  const s = await getDoc(doc(db, `groups/${gid}/files`, mid)); const d = s.exists() ? s.data().data : null;
  if (typeof d === 'string') attCache.set(k, d); return typeof d === 'string' ? d : null;
}
async function fillAtt(gid, n) {
  try {
    const d = await loadAtt(gid, n.dataset.mid); if (!d) throw 0;
    if (n.dataset.kind === 'image' && /^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(d)) { const im = new Image(); im.src = d; n.replaceChildren(im); }
    else if (n.dataset.kind === 'audio' && /^data:audio\/[a-z0-9.+-]+(;codecs=[a-z0-9.,-]+)?;base64,[A-Za-z0-9+\/=]+$/i.test(d)) { const a = document.createElement('audio'); a.controls = true; a.src = d; a.style.width = '100%'; n.replaceChildren(a); }
    else throw 0;
  } catch { n.textContent = '⚠️ attachment unavailable'; }
}

function mountChat(box, g, readonly) {
  box.innerHTML = '<div class="mlwrap"><div id="ml"></div><button class="jump raised" id="jump" hidden>' + pxi('down', 12) + ' New messages</button></div>' + (readonly ? '<p class="meta" style="padding:8px 12px">Admin view (read-only).</p>' :
    `<div class="composer"><div id="rec" class="recbar" style="display:none"></div>
     <div class="cbar sunken"><button class="cbtn" id="at" aria-label="Attach photo or file" title="Attach">${pxi('clip', 16)}</button><textarea id="mi" rows="1" maxlength="1000" placeholder="Message… (Enter to send, Shift+Enter for a new line)"></textarea><button class="cbtn" id="mic" aria-label="Record voice message" title="Voice message">${pxi('mic', 16)}</button><button class="cbtn send" id="ms" aria-label="Send" title="Send">${pxi('send', 16)}</button></div>
     <input type="file" id="fi" hidden><p class="meta chint">Files up to 650 KB · voice up to 60 s · moderators may review chats</p></div>`);
  const ml = $('#ml'), jump = $('#jump'); let rec = null, tick = null, first = true, lastA = null, lastT = 0, lastDay = '';
  jump.onclick = () => { ml.scrollTop = ml.scrollHeight; jump.hidden = true; };
  ml.addEventListener('scroll', () => { if (ml.scrollHeight - ml.scrollTop - ml.clientHeight < 60) jump.hidden = true; });
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); fillAtt(g.id, e.target); } }), {root: ml});
  const add = m => {
    const me = user && user.uid === m.authorID, a = m.att, dk = dayKey(m.createdAt), tms = m.createdAt?.toMillis ? m.createdAt.toMillis() : Date.now();
    if (dk !== lastDay) { const sep = document.createElement('div'); sep.className = 'daysep'; sep.innerHTML = `<span>${dayLabel(m.createdAt)}</span>`; ml.appendChild(sep); lastDay = dk; lastA = null; }
    const cont = lastA === m.authorID && tms - lastT < 5 * 60000; lastA = m.authorID; lastT = tms;
    const d = document.createElement('div');
    d.className = 'mrow' + (me ? ' me' : '') + (cont ? ' cont' : ''); d.id = 'm_' + m.id; if (a) d.dataset.att = '1';
    let body = m.text ? `<div class="mtext">${esc(m.text)}</div>` : '';
    if (a) body += a.kind === 'file'
      ? `<button class="dl filechip" data-mid="${esc(m.id)}" data-name="${esc(a.name)}">📄 <span>${esc(a.name)}</span><small>${Math.max(1, Math.round((a.size || 0) / 1024))} KB</small></button>`
      : `<div class="att" data-mid="${esc(m.id)}" data-kind="${esc(a.kind)}">⏳ ${a.kind === 'audio' ? 'Voice message…' : 'Photo…'}</div>`;
    const acts = `${me || isAdmin() ? `<u data-a="del" data-id="${esc(m.id)}">delete</u>` : ''}${me ? '' : `<u data-a="rep" data-id="${esc(m.id)}">report</u>`}`;
    d.innerHTML = `${me ? '' : `<span class="mav" data-av="${esc(m.authorID)}">${cont ? '' : avatarHtml(profCache.get(m.authorID), true)}</span>`}
      <div class="bubble">${me || cont ? '' : `<div class="mname">${plink(m.authorID, m.authorName)}</div>`}${body}<div class="mfoot"><span class="t">${hhmm(m.createdAt)}</span><span class="macts">${acts}</span></div></div>`;
    ml.appendChild(d); const at = d.querySelector('.att'); if (at) io.observe(at);
    if (!me && !cont && !profCache.has(m.authorID)) getProfile(m.authorID).then(pr => document.querySelectorAll(`#m_${CSS.escape(m.id)} .mav`).forEach(n => n.innerHTML = avatarHtml(pr, true)));
  };
  const unsub = onSnapshot(query(collection(db, `groups/${g.id}/messages`), orderBy('createdAt'), limitToLast(100)), snap => {
    const near = first || ml.scrollHeight - ml.scrollTop - ml.clientHeight < 140;
    snap.docChanges().forEach(ch => {
      const m = {id: ch.doc.id, ...ch.doc.data()};
      if (ch.type === 'added') { if (okItem(m.authorID, m.id) && !document.getElementById('m_' + m.id)) { add(m); if (!first && (!user || m.authorID !== user.uid)) { sfx('msg', 0.4); if (!near) jump.hidden = false; } } }
      else if (ch.type === 'removed') document.getElementById('m_' + m.id)?.remove();
      else { const t = document.querySelector(`#m_${m.id} .t`); if (t) t.textContent = hhmm(m.createdAt); }
    });
    if (first && !snap.docs.length) ml.innerHTML = `<div class="cempty">${sprite('ghost', 56)}<p>No messages yet.<br>Say hi to the group!</p></div>`;
    else if (snap.docs.length) ml.querySelector(':scope > .cempty')?.remove();
    first = false; if (near) ml.scrollTop = ml.scrollHeight;
  }, () => { ml.innerHTML = '<p class="err">Chat unavailable.</p>'; });
  unsubChat = () => { unsub(); io.disconnect(); clearInterval(tick); if (rec) rec.cancel(); };

  ml.onclick = async e => {
    const dl = e.target.closest('button.dl'), u = e.target.closest('u');
    if (dl) { const d = await loadAtt(g.id, dl.dataset.mid); if (!d) { toast('File unavailable.'); return; }
      const blob = await (await fetch(d)).blob(), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = (dl.dataset.name || 'file').replace(/[\\/:*?"<>|]/g, '_'); a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); return; }
    if (!u) return;
    const id = u.dataset.id, mel = document.getElementById('m_' + id);
    if (u.dataset.a === 'del') { const b = writeBatch(db); b.delete(doc(db, `groups/${g.id}/messages`, id)); if (mel && mel.dataset.att) b.delete(doc(db, `groups/${g.id}/files`, id));
      try { await b.commit(); } catch { toast('Could not delete.'); } }
    if (u.dataset.a === 'rep') { await report('message', id); mel?.remove(); }
  };
  if (readonly) return;

  const who = () => ({authorID: user.uid, authorName: user.displayName || 'User'});
  const sendAtt = async (kind, name, mime, url, size) => {
    if (url.length > 900000) { toast('File is too large (max ~650 KB).'); return; }
    const mref = doc(collection(db, `groups/${g.id}/messages`)), b = writeBatch(db);
    b.set(mref, {text: '', att: {kind, name: String(name).slice(0, 80), mime: String(mime).slice(0, 60), size}, ...who(), createdAt: serverTimestamp()});
    b.set(doc(db, `groups/${g.id}/files`, mref.id), {data: url, ...who(), createdAt: serverTimestamp()});
    try { await b.commit(); } catch { toast('Could not send.'); }
  };
  const send = async () => {
    const t = $('#mi').value.trim(); if (!t) return;
    const keep = $('#mi').value; $('#mi').value = ''; grow();
    try { await addDoc(collection(db, `groups/${g.id}/messages`), {text: t.slice(0, 1000), ...who(), createdAt: serverTimestamp()}); sfx('click', 0.3); ml.scrollTop = ml.scrollHeight; }
    catch { $('#mi').value = keep; grow(); toast('Could not send message.'); }
  };
  const grow = () => { const ta = $('#mi'); if (!ta) return; ta.style.height = 'auto'; ta.style.height = Math.min(140, ta.scrollHeight) + 'px'; };
  $('#mi').addEventListener('input', grow);
  $('#ms').onclick = send; $('#mi').onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); } };
  $('#at').onclick = () => $('#fi').click();
  $('#fi').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      if (f.type.startsWith('image/')) { const url = await resize(f); await sendAtt('image', f.name, 'image/jpeg', url, Math.round(url.length * .75)); }
      else if (f.size > 650 * 1024) toast('File is too large. Max 650 KB on the free plan.');
      else await sendAtt('file', f.name, f.type || 'application/octet-stream', await toDataURL(f), f.size);
    } catch { toast('Could not read the file.'); }
  };
  const startRec = async () => {
    if (!window.MediaRecorder || !navigator.mediaDevices) { toast('Voice recording is not supported in this browser.'); return; }
    let stream; try { stream = await navigator.mediaDevices.getUserMedia({audio: true}); } catch { toast('Microphone access was denied.'); return; }
    const mt = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg;codecs=opus'].find(t => MediaRecorder.isTypeSupported(t)) || '';
    const mr = new MediaRecorder(stream, {...(mt ? {mimeType: mt} : {}), audioBitsPerSecond: 24000});
    const chunks = []; let cancelled = false; const t0 = Date.now();
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop()); clearInterval(tick); rec = null;
      const mic = $('#mic'), r = $('#rec'); if (mic) { mic.innerHTML = pxi('mic', 16); mic.classList.remove('rec'); } if (r) r.style.display = 'none';
      if (cancelled || !chunks.length) return;
      const blob = new Blob(chunks, {type: mr.mimeType || mt || 'audio/webm'});
      if (blob.size > 650 * 1024) { toast('Voice message is too long.'); return; }
      await sendAtt('audio', 'voice', blob.type, await toDataURL(blob), blob.size);
    };
    mr.start();
    rec = {stop: () => { if (mr.state !== 'inactive') mr.stop(); }, cancel: () => { cancelled = true; rec && rec.stop(); }};
    $('#mic').innerHTML = pxi('stop', 14); $('#mic').classList.add('rec'); const r = $('#rec'); r.style.display = 'flex';
    r.innerHTML = '<span class="recdot"></span> Recording <span id="rt">0:00</span> <span class="meta">· tap ■ to send</span> <u id="rc" style="margin-left:auto">cancel</u>';
    $('#rc').onclick = () => rec && rec.cancel();
    tick = setInterval(() => { const sec = Math.floor((Date.now() - t0) / 1000), rt = $('#rt');
      if (rt) rt.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); if (sec >= 60) rec && rec.stop(); }, 500);
  };
  $('#mic').onclick = () => rec ? rec.stop() : startRec();
}

function route() {
  const h = location.hash;
  if (h.startsWith('#chat=')) chatWindow(h.slice(6).replace(/[^A-Za-z0-9]/g, ''));
  else if (h.startsWith('#join=')) joinByCode(h);
  else if (h.startsWith('#haunt=')) { const id = h.slice(7).replace(/[^A-Za-z0-9]/g, ''); history.replaceState(null, '', location.pathname); showView('games'); if (id) joinRoom(id); }
}
